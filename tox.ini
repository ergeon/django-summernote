[tox]
envlist =
    py312-{dj42,dj52}

[travis]
python =
    3.12: py312

[testenv]
basepython =
    py312: python3.12

extras =
    dev

deps =
    coverage

    dj32: Django<3.3
    dj41: Django<4.2
    dj42: Django<4.3
    dj52: Django>=5.2,<5.3
    djmain: https://github.com/django/django/archive/main.tar.gz

commands = coverage run -m pytest
